<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#24243a" />
    <title>SpecCraft — студия Markdown</title>
    <link rel="stylesheet" href="studio.css" />
    <script defer src="vendor/lucide.min.js"></script>
    <script defer src="vendor/markdown-it.min.js"></script>
    <script defer src="vendor/markdown-it-mark.min.js"></script>
    <script defer src="vendor/highlightjs/highlight.min.js"></script>
    <script type="module" src="studio.js"></script>
  </head>
  <body>
    <div id="workspace">
      <nav class="rail" aria-label="Инструменты студии">
        <div class="brand-icon" aria-label="SpecCraft">
          <b></b><b></b><b></b>
        </div>
        <button
          class="topbar-toggle"
          type="button"
          data-action="toggle-topbar"
          aria-controls="workspace-toolbar"
          aria-expanded="true"
          aria-label="Скрыть верхнюю панель"
          title="Скрыть верхнюю панель"
        >
          <i data-lucide="panel-top-close" aria-hidden="true"></i></button
        ><button
          data-action="files"
          title="Файлы и структура"
          aria-label="Файлы и структура"
        >
          <i data-lucide="panels-top-left"></i></button
        ><button
          data-action="new"
          title="Создать из шаблона"
          aria-label="Создать из шаблона"
        >
          <i data-lucide="layout-template"></i></button
        ><button
          class="rail-bottom"
          data-action="style"
          title="Оформление документа"
          aria-label="Оформление документа"
        >
          <i data-lucide="settings-2"></i>
        </button>
      </nav>
      <aside class="sidebar" id="workspace-sidebar">
        <div class="sidebar-navigation">
          <div class="brand">SpecCraft<span>Студия Markdown</span></div>
          <button
            class="topbar-toggle"
            type="button"
            data-action="toggle-topbar"
            aria-controls="workspace-toolbar"
            aria-expanded="true"
            title="Скрыть верхнюю панель"
          >
            <i data-lucide="panel-top-close" aria-hidden="true"></i>
            <span>Скрыть верхнюю панель</span>
          </button>
          <section class="documents-wrap">
            <div class="side-heading">
              <h2>Документы</h2>
              <button
                data-action="new"
                title="Новый документ"
                aria-label="Новый документ"
              >
                <i data-lucide="plus"></i>
              </button>
            </div>
            <div id="files"></div>
            <button class="import" data-action="open">
              <i data-lucide="folder-open"></i>Открыть файл
            </button>
          </section>
          <section class="outline-wrap">
            <div class="side-heading">
              <h2>Структура</h2>
              <i data-lucide="list-tree"></i>
            </div>
            <div id="outline"></div>
          </section>
        </div>
        <div class="sidebar-tools">
          <button
            class="sidebar-tools-toggle"
            type="button"
            data-action="toggle-sidebar-tools"
            aria-expanded="false"
            aria-controls="sidebar-tool-list"
          >
            <i data-lucide="chevron-right" aria-hidden="true"></i>Инструменты
          </button>
          <div class="side-utilities" id="sidebar-tool-list" hidden>
            <button data-action="templates">
              <i data-lucide="layout-template"></i>Шаблоны
            </button>
            <button data-action="trace">
              <i data-lucide="list-checks"></i>Связи требований
            </button>
            <button data-action="links">
              <i data-lucide="link-2"></i>Ссылки разделов
            </button>
            <button data-action="versions">
              <i data-lucide="history"></i>Версии
            </button>
            <button class="mobile-style" data-action="style">
              <i data-lucide="settings-2"></i>Оформление документа
            </button>
            <button data-action="transfer">
              <i data-lucide="folder-sync"></i>Перенос данных
            </button>
            <button data-action="ai">
              <i data-lucide="sparkles"></i>Для ИИ
            </button>
            <button data-action="trash">
              <i data-lucide="trash-2"></i>Корзина
              <span id="trash-count"></span>
            </button>
          </div>
        </div>
        <div class="local">
          <i data-lucide="hard-drive"></i> Локальное пространство
        </div>
      </aside>
      <div
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-controls="workspace-sidebar"
        aria-label="Ширина левой панели"
        title="Перетащите для изменения ширины. Двойной щелчок возвращает исходную ширину."
        tabindex="0"
      ></div>
      <main>
        <div id="workspace-toolbar">
          <header class="topbar">
            <button
              class="mobile-menu"
              data-action="files"
              aria-label="Показать документы"
            >
              <i data-lucide="panel-left"></i></button
            ><span class="crumb">Документы</span><span class="slash">/</span
            ><button
              id="filename"
              data-action="rename"
              title="Переименовать файл"
            ></button
            ><span class="spacer"></span
            ><button
              data-action="share"
              aria-label="Поделиться"
              title="Поделиться"
            >
              <i data-lucide="share-2" aria-hidden="true"></i
              ><span>Поделиться</span></button
            ><button
              data-action="collaboration-discussion"
              hidden
              aria-label="Обсуждение"
              title="Обсуждение"
            >
              <i data-lucide="messages-square" aria-hidden="true"></i
              ><span>Обсуждение</span></button
            ><button
              data-action="collaboration-exit"
              hidden
              aria-label="Выйти из общего документа"
              title="Выйти из общего документа"
            >
              <i data-lucide="log-out" aria-hidden="true"></i></button
            ><button
              data-action="collaboration-people"
              hidden
              aria-label="Участники общего документа"
              aria-expanded="false"
              title="Участники общего документа"
            >
              <i data-lucide="users" aria-hidden="true"></i
              ><span></span></button
            ><button class="primary" data-action="export">
              <i data-lucide="download"></i><span>Экспорт</span>
            </button>
          </header>
          <aside
            id="live-people"
            aria-label="Присутствие коллег"
            hidden
          ></aside>
          <div class="controls">
            <div
              role="group"
              aria-label="Представление документа"
              class="modes"
            >
              <button data-mode="edit">
                <i data-lucide="square-pen"></i>Редактор</button
              ><button data-mode="source">
                <i data-lucide="code-xml"></i>Markdown</button
              ><button data-mode="read"><i data-lucide="eye"></i>Чтение</button
              ><button
                data-mode="pdf"
                aria-label="Предпросмотр PDF"
                title="Предпросмотр PDF"
              >
                <i data-lucide="file-text" aria-hidden="true"></i>PDF
              </button>
            </div>
            <span class="spacer"></span
            ><button
              class="tool"
              data-action="undo"
              title="Отменить"
              aria-label="Отменить"
            >
              <i data-lucide="undo-2"></i></button
            ><button
              class="tool"
              data-action="redo"
              title="Повторить"
              aria-label="Повторить"
            >
              <i data-lucide="redo-2"></i></button
            ><button
              class="insert"
              data-action="insert"
              aria-label="Вставить"
              title="Вставить"
            >
              <i data-lucide="plus" aria-hidden="true"></i><span>Вставить</span>
            </button>
          </div>
        </div>
        <div class="compact-mobile-header">
          <button
            type="button"
            class="mobile-menu"
            data-action="files"
            aria-label="Показать документы"
          >
            <i data-lucide="panel-left" aria-hidden="true"></i>Документы
          </button>
        </div>
        <div id="scroll">
          <section id="empty-workspace" hidden>
            <h1>Пока нет документов</h1>
            <button class="primary" data-action="new">Создать документ</button>
            <button data-action="open">Открыть файл</button>
            <button data-action="trash">Корзина</button>
          </section>
          <section id="pdf-preview" aria-label="Предпросмотр PDF" hidden>
            <div class="pdf-controls">
              <label>
                <span>Профиль</span>
                <select data-pdf="profile" aria-label="Профиль PDF">
                  <option value="screen">PDF для экрана</option>
                  <option value="a4">Строго A4</option>
                </select>
              </label>
              <div class="pdf-navigation">
                <button
                  type="button"
                  data-pdf="previous"
                  aria-label="Предыдущая страница"
                >
                  <i data-lucide="chevron-left" aria-hidden="true"></i>
                </button>
                <select data-pdf="page" aria-label="Страница"></select>
                <button
                  type="button"
                  data-pdf="next"
                  aria-label="Следующая страница"
                >
                  <i data-lucide="chevron-right" aria-hidden="true"></i>
                </button>
              </div>
              <select data-pdf="zoom" aria-label="Масштаб PDF">
                <option value="fit">По ширине</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
              <label>
                <input type="checkbox" data-pdf="numbering" />Номера страниц
              </label>
              <button type="button" data-pdf="print">Печать</button>
              <button type="button" class="primary" data-pdf="download">
                Скачать PDF
              </button>
            </div>
            <div class="pdf-status">
              <span data-pdf="status" role="status"></span
              ><button type="button" data-pdf="retry" hidden>Повторить</button>
            </div>
            <div
              class="pdf-warnings"
              data-pdf="warnings"
              aria-label="Предупреждения PDF"
              hidden
            ></div>
            <div class="pdf-layout">
              <nav
                class="pdf-thumbnails"
                data-pdf="thumbnails"
                aria-label="Миниатюры страниц"
              ></nav>
              <div
                class="pdf-stage"
                data-pdf="stage"
                tabindex="0"
                aria-label="Страницы PDF"
              ></div>
            </div>
            <div class="pdf-block-controls">
              <select
                data-pdf="block"
                aria-label="Блок на странице"
                title="Выберите блок на текущей странице"
              ></select>
              <span class="pdf-block-location" data-pdf="placement"></span>
              <button type="button" data-pdf="edit">К блоку в редакторе</button>
              <details class="pdf-rules-menu" data-pdf="rules">
                <summary>Размещение блока</summary>
                <div class="pdf-rule-fields">
                  <label>
                    Начало блока
                    <select data-pdf="placement-rule" aria-label="Начало блока">
                      <option value="auto">Автоматически</option>
                      <option value="break-before">С новой страницы</option>
                      <option value="separate-sheet">На отдельном листе</option>
                    </select>
                  </label>
                  <p data-pdf="placement-help"></p>
                  <label class="pdf-keep-next">
                    <input type="checkbox" data-pdf="keep-next" />Вместе со
                    следующим блоком
                  </label>
                  <button type="button" data-pdf="clear" hidden>
                    Вернуть автоматическое размещение
                  </button>
                </div>
              </details>
            </div>
          </section>
          <article class="paper">
            <div class="doc-label">
              <span class="doc-label-stroke" aria-hidden="true"></span>
              <b id="kind" hidden></b>
              <button
                class="doc-label-edit"
                type="button"
                data-action="edit-doc-label"
                aria-label="Изменить надпись над документом"
                title="Изменить надпись над документом"
              >
                <span></span><i data-lucide="pencil" aria-hidden="true"></i>
              </button>
              <button
                class="expand-diagrams"
                data-action="expand-diagrams"
                hidden
              >
                <i data-lucide="maximize-2" aria-hidden="true"></i>Развернуть
                все схемы
              </button>
            </div>
            <div id="blocks"></div>
            <textarea
              hidden
              id="source"
              aria-label="Исходный Markdown"
              spellcheck="false"
            ></textarea
            ><button class="add-end" data-action="append">
              <i data-lucide="plus"></i>Абзац
            </button>
          </article>
        </div>
        <footer>
          <span id="save" role="status"></span>
          <button data-action="collaboration-conflict" hidden>
            Сравнить правки
          </button>
          <span id="wordcount"></span>
        </footer>
      </main>
      <aside
        class="graph-dock"
        id="graph-dock"
        aria-label="Свойства схемы"
        hidden
      >
        <header>Свойства схемы</header>
        <div class="props"></div>
      </aside>
      <dialog id="modal"></dialog>
    </div>
    <input
      id="file-input"
      type="file"
      accept=".md,.markdown,.txt,.mmd,.mermaid,text/markdown"
      hidden
      multiple
    />
    <div id="notice" role="status" hidden></div>
  </body>
</html>
