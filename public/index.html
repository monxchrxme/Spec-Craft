<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#24243a" />
    <title>SpecCraft MD — редактор Markdown с экспортом в PDF</title>
    <meta name="description" content="SpecCraft — визуальный редактор Markdown в браузере. Редактируйте документы с таблицами, формулами и диаграммами, просматривайте результат и экспортируйте его в PDF." />
    <link rel="canonical" href="https://spec-craft-md.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpecCraft" />
    <meta property="og:title" content="SpecCraft MD — редактор Markdown с экспортом в PDF" />
    <meta property="og:description" content="Визуальный редактор Markdown в браузере с таблицами, формулами, диаграммами и экспортом в PDF." />
    <meta property="og:url" content="https://spec-craft-md.vercel.app/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SpecCraft",
        "alternateName": "SpecCraft MD",
        "url": "https://spec-craft-md.vercel.app/"
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="studio.css" />
    <script defer src="vendor/lucide.min.js"></script>
    <script defer src="vendor/markdown-it.min.js"></script>
    <script defer src="vendor/markdown-it-mark.min.js"></script>
    <script defer src="vendor/highlightjs/highlight.min.js"></script>
    <script type="module" src="studio.js"></script>
  </head>
  <body>
    <div id="workspace" spellcheck="false" writingsuggestions="false">
      <nav class="rail" aria-label="Инструменты студии">
        <div class="brand-icon" aria-label="SpecCraft">
          <b></b><b></b><b></b>
        </div>
        <button
          class="topbar-toggle"
          type="button"
          data-action="toggle-topbar"
          aria-controls="workspace-toolbar"
          aria-expanded="true"
          aria-label="Скрыть верхнюю панель"
          title="Скрыть верхнюю панель"
        >
          <i data-lucide="panel-top-close" aria-hidden="true"></i></button
        ><button
          data-action="files"
          title="Файлы и структура"
          aria-label="Файлы и структура"
          aria-controls="workspace-sidebar"
          aria-expanded="true"
        >
          <i data-lucide="panels-top-left"></i></button
        ><button
          type="button"
          data-action="open"
          title="Открыть файл"
          aria-label="Открыть файл"
        >
          <i data-lucide="folder-open" aria-hidden="true"></i></button
        ><button
          data-action="new"
          title="Создать из шаблона"
          aria-label="Создать из шаблона"
        >
          <i data-lucide="layout-template"></i></button>
        <a
          class="rail-bottom"
          href="https://github.com/monxchrxme/Spec-Craft"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Проект и документация на GitHub (откроется в новой вкладке)"
          title="Проект и документация на GitHub"
        ><i data-lucide="github" aria-hidden="true"></i></a>
        <button
          type="button"
          data-action="private-sync"
          aria-label="Личная синхронизация"
          title="Личная синхронизация"
        ><i data-lucide="user-round" aria-hidden="true"></i></button
        ><button
          data-action="style"
          title="Оформление документа"
          aria-label="Оформление документа"
        >
          <i data-lucide="settings-2"></i>
        </button>
        <label class="rail-theme" title="Тема интерфейса">
          <i data-lucide="palette" aria-hidden="true"></i>
          <select data-theme-picker aria-label="Тема интерфейса"></select>
        </label>
      </nav>
      <aside class="sidebar" id="workspace-sidebar">
        <div class="sidebar-navigation">
          <h1 class="brand">SpecCraft</h1>
          <button
            class="topbar-toggle"
            type="button"
            data-action="toggle-topbar"
            aria-controls="workspace-toolbar"
            aria-expanded="true"
            title="Скрыть верхнюю панель"
          >
            <i data-lucide="panel-top-close" aria-hidden="true"></i>
            <span>Скрыть верхнюю панель</span>
          </button>
          <div class="sidebar-panes">
            <section class="documents-wrap" aria-labelledby="documents-title">
              <div class="side-heading">
                <h2 id="documents-title">
                  <button type="button" class="sidebar-section-toggle" id="documents-section-toggle"
                    aria-controls="documents-content" aria-expanded="true">
                    <i data-lucide="chevron-right" aria-hidden="true"></i>Документы
                  </button>
                </h2>
                <div class="side-actions">
                  <button type="button" id="files-search-toggle" title="Поиск по файлам"
                    aria-label="Поиск по файлам" aria-controls="files-search" aria-expanded="false">
                    <i data-lucide="search" aria-hidden="true"></i>
                  </button>
                  <button type="button" data-action="open" title="Открыть файл" aria-label="Открыть файл">
                    <i data-lucide="folder-open" aria-hidden="true"></i>
                  </button>
                  <button type="button" data-action="new-folder" title="Новая папка" aria-label="Новая папка">
                    <i data-lucide="folder-plus" aria-hidden="true"></i>
                  </button>
                  <button type="button" data-action="new" title="Новый документ" aria-label="Новый документ">
                    <i data-lucide="plus" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div class="sidebar-section-content" id="documents-content">
                <input id="files-search" class="side-search" type="search" placeholder="Имя файла"
                  aria-label="Поиск по файлам" autocomplete="off" hidden />
                <div class="side-scroll" id="files-scroll">
                  <div id="files"></div>
                  <p id="files-empty" class="side-empty" role="status" hidden>Файлы не найдены.</p>
                </div>
              </div>
            </section>
            <div class="sidebar-section-resizer" id="sidebar-section-resizer"
              role="separator" aria-orientation="horizontal" aria-controls="outline-section"
              aria-label="Высота структуры" title="Потяните для изменения высоты" tabindex="0"></div>
            <section class="outline-wrap" id="outline-section" aria-labelledby="outline-title">
              <div class="side-heading">
                <h2 id="outline-title">
                  <button type="button" class="sidebar-section-toggle" id="outline-section-toggle"
                    aria-controls="outline-content" aria-expanded="true">
                    <i data-lucide="chevron-right" aria-hidden="true"></i>Структура
                  </button>
                </h2>
                <div class="side-actions">
                  <button id="outline-remove" type="button" title="Удалить выбранные разделы"
                    aria-label="Удалить выбранные разделы" hidden>
                    <i data-lucide="trash-2" aria-hidden="true"></i>
                  </button>
                  <button type="button" id="outline-search-toggle" title="Поиск по структуре"
                    aria-label="Поиск по структуре" aria-controls="outline-search" aria-expanded="false">
                    <i data-lucide="search" aria-hidden="true"></i>
                  </button>
                  <button id="outline-toggle-all" type="button" aria-label="Свернуть все подразделы"
                    aria-controls="outline" disabled>
                    <i data-lucide="list-tree" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <div class="sidebar-section-content" id="outline-content">
                <input id="outline-search" class="side-search" type="search" placeholder="Заголовок раздела"
                  aria-label="Поиск по структуре" autocomplete="off" hidden />
                <div class="side-scroll" id="outline-scroll">
                  <div id="outline"></div>
                  <p id="outline-empty" class="side-empty" role="status" hidden></p>
                </div>
              </div>
            </section>
          </div>
        </div>
        <div class="sidebar-tools">
          <div class="side-heading">
            <button
              class="sidebar-section-toggle"
              type="button"
              data-action="toggle-sidebar-tools"
              aria-expanded="false"
              aria-controls="sidebar-tool-list"
            >
              <i data-lucide="chevron-right" aria-hidden="true"></i>Инструменты
            </button>
          </div>
          <div class="side-utilities" id="sidebar-tool-list" hidden>
            <button data-action="templates">
              <i data-lucide="layout-template"></i>Шаблоны
            </button>
            <button data-action="trace">
              <i data-lucide="list-checks"></i>Связи требований
            </button>
            <button data-action="links">
              <i data-lucide="link-2"></i>Ссылки разделов
            </button>
            <button data-action="versions">
              <i data-lucide="history"></i>Версии
            </button>
            <button class="mobile-style" data-action="style">
              <i data-lucide="settings-2"></i>Оформление документа
            </button>
            <label class="mobile-style theme-field"
              >Тема интерфейса
              <select data-theme-picker></select>
            </label>
            <button data-action="transfer">
              <i data-lucide="folder-sync"></i>Перенос данных
            </button>
            <button data-action="private-sync">
              <i data-lucide="user-round"></i>Личная синхронизация
            </button>
            <button data-action="ai">
              <i data-lucide="sparkles"></i>Для ИИ
            </button>
            <button data-action="normalize-math">
              <i data-lucide="sigma"></i>Привести формулы к $ и $$
            </button>
            <button data-action="speaker-notes" aria-pressed="false">
              <i data-lucide="notebook-pen"></i>Заметки докладчика
            </button>
            <button data-action="hide-speaker-notes" aria-pressed="false">
              <i data-lucide="eye-off" aria-hidden="true"></i>Скрывать заметки на холсте
            </button>
            <button data-action="trash">
              <i data-lucide="trash-2"></i>Корзина
              <span id="trash-count"></span>
            </button>
          </div>
        </div>
      </aside>
      <div
        class="panel-resizer sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-controls="workspace-sidebar"
        aria-label="Ширина левой панели"
        title="Перетащите для изменения ширины. Двойной щелчок возвращает исходную ширину."
        tabindex="0"
      ></div>
      <main>
        <div id="workspace-toolbar">
          <header class="topbar">
            <button
              class="mobile-menu"
              data-action="files"
              aria-label="Показать документы"
              aria-controls="workspace-sidebar"
              aria-expanded="false"
            >
              <i data-lucide="panel-left"></i></button
            ><span class="crumb">Документы</span><span class="slash">/</span
            ><button
              id="filename"
              data-action="rename"
              title="Переименовать файл"
            ></button
            ><span class="spacer"></span
            ><button
              data-action="share"
              aria-label="Поделиться"
              title="Поделиться"
            >
              <i data-lucide="share-2" aria-hidden="true"></i
              ><span>Поделиться</span></button
            ><button
              data-action="collaboration-discussion"
              hidden
              aria-label="Комментарии"
              aria-expanded="false"
              aria-controls="modal"
              title="Комментарии"
            >
              <i data-lucide="messages-square" aria-hidden="true"></i
              ><span>Комментарии</span></button
            ><button
              data-action="collaboration-exit"
              hidden
              aria-label="Выйти из общего документа"
              title="Выйти из общего документа"
            >
              <i data-lucide="log-out" aria-hidden="true"></i></button
            ><button
              data-action="collaboration-people"
              hidden
              aria-label="Участники общего документа"
              aria-expanded="false"
              aria-controls="live-people"
              title="Участники общего документа"
            >
              <i data-lucide="users" aria-hidden="true"></i
              ><span></span></button
            ><button class="primary" data-action="export" aria-label="Экспорт" title="Экспорт">
              <i data-lucide="download" aria-hidden="true"></i><span>Экспорт</span>
            </button>
          </header>
          <aside
            id="live-people"
            aria-label="Присутствие коллег"
            hidden
          ></aside>
          <div class="controls">
            <div
              role="group"
              aria-label="Представление документа"
              class="modes"
            >
              <button data-mode="edit">
                <i data-lucide="square-pen"></i>Редактор</button
              ><button data-mode="source">
                <i data-lucide="code-xml"></i>Markdown</button
              ><button data-mode="latex">
                <i data-lucide="sigma"></i>LaTeX</button
              ><button data-mode="read"><i data-lucide="eye"></i>Чтение</button
              ><button
                data-mode="pdf"
                aria-label="Предпросмотр PDF"
                title="Предпросмотр PDF"
              >
                <i data-lucide="file-text" aria-hidden="true"></i>PDF
              </button>
            </div>
            <div class="source-controls" hidden>
              <label
                id="source-fold-control"
                title="Сворачивать длинные ссылки на фото и данные Excalidraw"
                ><input id="source-fold" type="checkbox" checked />Свернуть
                вложения</label
              >
              <label>
                <select id="source-view" aria-label="Предпросмотр">
                  <option value="pdf">Печатный вид</option>
                  <option value="document" selected>Блоки</option>
                  <option value="off">Скрыт</option>
                </select></label
              >
              <label
                ><input type="checkbox" id="source-sync" checked /> Следовать за
                текстом</label
              >
            </div>
            <div class="editing-tools">
              <button
                type="button"
                class="tool"
                id="document-search-toggle"
                title="Поиск по документу"
                aria-label="Поиск по документу"
                aria-controls="document-search"
                aria-expanded="false"
                aria-keyshortcuts="Control+F Meta+F"
              >
                <i data-lucide="search" aria-hidden="true"></i>
              </button>
              <button
                class="tool"
                data-action="undo"
                title="Отменить"
                aria-label="Отменить"
                aria-keyshortcuts="Control+Z Meta+Z"
              >
                <i data-lucide="undo-2"></i>
              </button>
              <button
                class="tool"
                data-action="redo"
                title="Повторить"
                aria-label="Повторить"
                aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"
              >
                <i data-lucide="redo-2"></i>
              </button>
              <button class="insert" data-action="insert" aria-label="Вставить" title="Вставить">
                <i data-lucide="plus" aria-hidden="true"></i><span>Вставить</span>
              </button>
            </div>
          </div>
        </div>
        <div class="compact-mobile-header">
          <button
            type="button"
            class="mobile-menu"
            data-action="files"
            aria-label="Показать документы"
            aria-controls="workspace-sidebar"
            aria-expanded="false"
          >
            <i data-lucide="panel-left" aria-hidden="true"></i>Документы
          </button>
        </div>
        <div id="document-search" role="search" aria-label="Поиск по документам" hidden>
          <div class="document-search-controls">
            <input type="search" placeholder="Найти в документе" aria-label="Найти в документе" />
            <span role="status" aria-live="polite"></span>
            <button type="button" data-find="scope" aria-pressed="false"
              aria-keyshortcuts="Control+Shift+F Meta+Shift+F" title="Поиск по всем файлам">Все файлы</button>
            <button type="button" data-find="previous" aria-label="Предыдущее совпадение" title="Предыдущее совпадение">
              <i data-lucide="chevron-up" aria-hidden="true"></i>
            </button>
            <button type="button" data-find="next" aria-label="Следующее совпадение" title="Следующее совпадение">
              <i data-lucide="chevron-down" aria-hidden="true"></i>
            </button>
            <button type="button" data-find="close" aria-label="Закрыть поиск" title="Закрыть поиск · Esc">
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </div>
          <ul class="document-search-results" aria-label="Совпадения в файлах" hidden></ul>
        </div>
        <div id="scroll">
          <section id="empty-workspace" hidden>
            <h1>Пока нет документов</h1>
            <button class="primary" data-action="new">Создать документ</button>
            <button data-action="open">Открыть файл</button>
            <button data-action="trash">Корзина</button>
          </section>
          <section id="pdf-preview" aria-label="Предпросмотр PDF" hidden>
            <div class="pdf-controls">
              <label>
                <span>Профиль</span>
                <select data-pdf="profile" aria-label="Профиль PDF">
                  <option value="screen">PDF для экрана</option>
                  <option value="a4">Строго A4</option>
                </select>
              </label>
              <div class="pdf-navigation">
                <button
                  type="button"
                  data-pdf="previous"
                  aria-label="Предыдущая страница"
                >
                  <i data-lucide="chevron-left" aria-hidden="true"></i>
                </button>
                <select data-pdf="page" aria-label="Страница"></select>
                <button
                  type="button"
                  data-pdf="next"
                  aria-label="Следующая страница"
                >
                  <i data-lucide="chevron-right" aria-hidden="true"></i>
                </button>
              </div>
              <select data-pdf="zoom" aria-label="Масштаб PDF">
                <option value="fit">По ширине</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
              </select>
              <label>
                <input type="checkbox" data-pdf="numbering" />Номера страниц
              </label>
              <button type="button" data-action="pdf-settings">
                Параметры страниц
              </button>
              <button type="button" data-pdf="print">Печать</button>
              <button type="button" class="primary" data-pdf="download">
                Скачать PDF
              </button>
            </div>
            <div class="pdf-status">
              <span data-pdf="status" role="status"></span
              ><button type="button" data-pdf="retry" hidden>Повторить</button>
            </div>
            <div
              class="pdf-warnings"
              data-pdf="warnings"
              aria-label="Предупреждения PDF"
              hidden
            ></div>
            <div class="pdf-layout">
              <nav
                class="pdf-thumbnails"
                data-pdf="thumbnails"
                aria-label="Миниатюры страниц"
              ></nav>
              <div
                class="pdf-stage"
                data-pdf="stage"
                tabindex="0"
                aria-label="Страницы PDF"
              ></div>
            </div>
            <div class="pdf-block-controls">
              <select
                data-pdf="block"
                aria-label="Блок на странице"
                title="Выберите блок на текущей странице"
              ></select>
              <span class="pdf-block-location" data-pdf="placement"></span>
              <button type="button" data-pdf="edit">К блоку в редакторе</button>
              <label class="pdf-spacer-size" data-pdf="spacer-size" hidden>
                Высота интервала, мм
                <input type="number" min="0" data-pdf="spacer-height"
                  title="Пустое поле использует общую высоту" />
              </label>
              <div
                class="pdf-rule-fields"
                role="group"
                aria-label="Размещение блока"
              >
                <label>
                  Размещение блока
                  <select
                    data-pdf="placement-rule"
                    aria-label="Начало блока"
                    aria-describedby="pdf-placement-help"
                  >
                    <option value="auto">Автоматически</option>
                    <option value="break-before">С новой страницы</option>
                    <option value="break-after">Разрыв после блока</option>
                    <option value="separate-sheet">На отдельном листе</option>
                    <option value="landscape-sheet">
                      На альбомном листе A4
                    </option>
                  </select>
                </label>
                <details
                  class="pdf-placement-info"
                  data-pdf="placement-info"
                  hidden
                >
                  <summary
                    aria-label="Как работает размещение"
                    title="Как работает размещение"
                  >
                    <i data-lucide="circle-help" aria-hidden="true"></i>
                  </summary>
                  <p id="pdf-placement-help" data-pdf="placement-help"></p>
                </details>
                <label class="pdf-keep-next">
                  <input type="checkbox" data-pdf="keep-next" />Вместе со
                  следующим блоком
                </label>
                <button type="button" data-pdf="clear" hidden>
                  Вернуть автоматическое размещение
                </button>
              </div>
            </div>
          </section>
          <article class="paper">
            <div class="doc-label">
              <span class="doc-label-stroke" aria-hidden="true"></span>
              <b id="kind" hidden></b>
              <button
                class="doc-label-edit"
                type="button"
                data-action="edit-doc-label"
                aria-label="Изменить надпись над документом"
                title="Изменить надпись над документом"
              >
                <span></span><i data-lucide="pencil" aria-hidden="true"></i>
              </button>
              <button
                class="expand-diagrams"
                data-action="expand-diagrams"
                hidden
              >
                <i data-lucide="maximize-2" aria-hidden="true"></i>Развернуть
                все схемы
              </button>
            </div>
            <div id="blocks"></div>
            <section id="source-workspace" hidden>
              <div class="source-columns">
                <textarea
                  id="source"
                  aria-label="Исходный Markdown"
                  autocorrect="off"
                  autocapitalize="none"
                ></textarea>
                <div
                  role="separator"
                  tabindex="0"
                  aria-label="Ширина исходника"
                  aria-orientation="vertical"
                  id="source-divider"
                ></div>
                <section id="source-preview" aria-label="Результат"></section>
              </div>
            </section>
            <button class="add-end" data-action="append">
              <i data-lucide="plus"></i>Абзац
            </button>
          </article>
        </div>
        <footer>
          <span id="save" role="status"></span>
          <span id="private-save" hidden></span>
          <button data-action="collaboration-conflict" hidden>
            Сравнить правки
          </button>
          <span id="wordcount"></span>
        </footer>
      </main>
      <div
        class="panel-resizer inspector-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Ширина правой панели"

      <aside
